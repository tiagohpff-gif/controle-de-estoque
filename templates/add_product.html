{% extends "base.html" %}

{% block title %}Novo Produto{% endblock %}

{% block content %}

    <h1 class="page-title">Novo Produto</h1>

    <form action="{{ url_for('novo_produto') }}" method="post" enctype="multipart/form-data" class="form-produto">
        <label>Nome do produto</label>
        <input type="text" name="nome" required placeholder="Ex: Guaraná">

        <label>Imagem</label>
        <input type="file" name="imagem" accept="image/*">

        <button type="submit" class="btn-entrada">Cadastrar</button>
    </form>

{% endblock %}
